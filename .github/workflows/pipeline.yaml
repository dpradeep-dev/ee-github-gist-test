on: [push]
name: Build and Deploy
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Dotnet
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore src/api/api.csproj
      - name: Build
        run: dotnet build --no-restore --configuration Release src/api/
      - name: Test
        run: dotnet test --no-restore --configuration Release src/tests/
      - name: Docker Build
        uses: docker/build-push-action@v2
        with:
          context: src/
          push: false
          tags: github/github-gist-api:latest
